[package]
name = "cad-wasm"
description = "The JS/WASM boundary. Marshalling only; no CAD logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Starts every session with a few lines so the render pipeline can be seen
# before the LINE command exists. Never enabled in release builds.
demo-scene = []

[dependencies]
cad-core.workspace = true
cad-document.workspace = true
cad-commands.workspace = true
cad-render.workspace = true
cad-dxf.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true

[lints]
workspace = true
