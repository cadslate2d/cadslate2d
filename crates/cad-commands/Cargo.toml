[package]
name = "cad-commands"
description = "The interactive session: command state machines, selection, transient edits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Exposes the headless test harness (`cad_commands::testing`) to other crates' tests,
# and the AI corpus's evaluation (`cad_commands::evaluation`, `examples/ai-eval.rs`).
testing = []

[dependencies]
cad-core.workspace = true
cad-geometry.workspace = true
cad-input.workspace = true
cad-document.workspace = true
cad-intent.workspace = true
cad-layout.workspace = true
# A drawn plan's group describes it as JSON (#325, #337).
serde_json.workspace = true

[[example]]
name = "ai-eval"
required-features = ["testing"]

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
cad-intent = { workspace = true, features = ["testing"] }
