# cargo-deny (#296, ADR-0035): what the Rust dependencies may be licensed
# under, and that they carry no known vulnerabilities. Part of
# `scripts/check.sh`. The allow list is what is compatible with the
# repository's AGPL-3.0-or-later; add to it deliberately.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Met today: MIT, Apache-2.0, Unicode-3.0, and our own AGPL. The rest are
# permissive licences a new dependency may well carry.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "AGPL-3.0-or-later",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
