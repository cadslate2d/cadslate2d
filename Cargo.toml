[workspace]
resolver = "3"
members = ["crates/*", "benches"]
# The fuzz crate is its own workspace: nightly and libFuzzer (#177).
exclude = ["fuzz"]

[workspace.package]
version = "0.2.17"
edition = "2024"
rust-version = "1.90"
publish = false
# ADR-0035: the whole repository is AGPL-3.0-or-later.
license = "AGPL-3.0-or-later"

[workspace.dependencies]
cad-core = { path = "crates/cad-core" }
cad-geometry = { path = "crates/cad-geometry" }
cad-input = { path = "crates/cad-input" }
cad-text = { path = "crates/cad-text" }
cad-document = { path = "crates/cad-document" }
cad-commands = { path = "crates/cad-commands" }
cad-dxf = { path = "crates/cad-dxf" }
cad-dwg = { path = "crates/cad-dwg" }
cad-intent = { path = "crates/cad-intent" }
cad-layout = { path = "crates/cad-layout" }
cad-render = { path = "crates/cad-render" }
cad-plot = { path = "crates/cad-plot" }

# The wasm-bindgen crate version must equal the installed wasm-bindgen-cli
# version; scripts/build-wasm.sh checks this (ADR-0004).
wasm-bindgen = "=0.2.129"
js-sys = "0.3.106"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a coordinate written is the coordinate read back.
serde_json = { version = "1", features = ["float_roundtrip"] }
# ADR-0037: the intent IR's JSON Schema is generated from its Rust types.
schemars = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
rstar = "0.13"
robust = "1"
proptest = "1"
criterion = { version = "0.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# DESIGN §21.1: no indiscriminate float equality. Compare through cad_core::tolerance.
float_cmp = "deny"

# The layout search runs thousands of steps per room: its tests and the
# debug WASM build would be ten times slower unoptimised (ADR-0039).
[profile.dev.package.cad-layout]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 1
incremental = false
