name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the toolchain, components, and wasm target.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Resolve pinned wasm-bindgen version
        id: wbg
        run: |
          version=$(cargo tree -p cad-wasm -i wasm-bindgen --depth 0 --prefix none | awk '{ sub(/^v/, "", $2); print $2; exit }')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wbg.outputs.version }},cargo-deny,cargo-about

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      # Format, clippy, Rust tests, the AI corpus replayed, crate boundaries, WASM build, typecheck, lint, unit tests.
      - name: Check
        run: scripts/check.sh

      - name: Build production bundle
        run: pnpm --dir web build:e2e

      - name: Install Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: End-to-end tests
        # Stop early when a whole browser is broken instead of timing out one test at a time.
        run: pnpm --dir web e2e --max-failures=15
        env:
          E2E_BROWSERS: chromium

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

      # What cadslate2d.com serves: the app built with the production AI
      # service's address (the repository variable AI_SERVICE_URL).
      - name: Build the published bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm --dir web build
        env:
          VITE_AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL || 'https://api.cadslate2d.com' }}

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-published
          path: web/dist
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  # Publishes main to Cloudflare Pages once the account's token is set
  # (scripts/deploy-pages.sh); until then it says so and passes.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A GitHub environment, so the repository lists each publish as a
    # deployment, with the address it went to.
    environment:
      name: production
      url: https://cadslate2d.com
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: web-published
          path: web/dist

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish to Cloudflare Pages
        run: scripts/deploy-pages.sh web/dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
