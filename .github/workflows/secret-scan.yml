# A secret scan of the whole history on every push and pull request
# (#295). The gitleaks binary itself, pinned; not the gitleaks GitHub
# Action, which needs a licence key for an organisation.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the history
        run: ./gitleaks git --no-banner --redact --exit-code 1 .
