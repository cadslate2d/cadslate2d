# The contributor licence agreement check (#294, ADR-0035): an outside
# pull request is marked until its author has signed CLA.md by commenting
# on it. Signatures are kept in the `cla-signatures` branch. The
# maintainer and bots are exempt.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/cadslate2d/cadslate2d/blob/main/CLA.md
          branch: cla-signatures
          allowlist: leo-aa88,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thank you for the pull request. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/cadslate2d/cadslate2d/blob/main/CLA.md)
            and, if you agree, sign it by commenting below:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
          lock-pullrequest-aftermerge: false
