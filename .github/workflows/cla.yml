# The contributor licence agreement notice (#294, ADR-0035): an outside
# pull request is told, once, when it is opened, that submitting it accepts
# CLA.md. Nothing is asked of the author and nothing blocks the merge. The
# maintainer and bots are not told. The pull request's code is never
# checked out here.
name: CLA

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      !contains(fromJSON('["leo-aa88", "dependabot[bot]", "github-actions[bot]"]'),
      github.event.pull_request.user.login)
    steps:
      - name: Point the author to the CLA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Thank you for the pull request. Before it can be merged, please read the [Contributor License Agreement](https://github.com/$GITHUB_REPOSITORY/blob/main/CLA.md). By submitting this pull request, you confirm that you agree to it."
