# Coverage-guided fuzzing (#177): `cargo +nightly fuzz run <target>`, or
# `scripts/fuzz.sh`. Its own workspace: libFuzzer needs a nightly toolchain
# and sanitizer flags the rest of the build does not take.
[package]
name = "cad-fuzz"
license = "AGPL-3.0-or-later"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
cad-core = { path = "../crates/cad-core" }
cad-dxf = { path = "../crates/cad-dxf" }
cad-dwg = { path = "../crates/cad-dwg" }
cad-input = { path = "../crates/cad-input" }
cad-intent = { path = "../crates/cad-intent" }

[[bin]]
name = "dxf_import"
path = "fuzz_targets/dxf_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dwg_read"
path = "fuzz_targets/dwg_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input_resolve"
path = "fuzz_targets/input_resolve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "intent_parse"
path = "fuzz_targets/intent_parse.rs"
test = false
doc = false
bench = false

[workspace]
