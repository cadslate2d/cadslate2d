# pnpm's settings for the web project. A dependency is taken only once it
# has been published for two weeks (in minutes): long enough for a
# malicious or broken release to be found and pulled before it reaches us.
minimumReleaseAge: 20160
# Exceptions, each an exact version, taken knowingly before its two weeks,
# go under `minimumReleaseAgeExclude:` with the date each may come out.

# Versions forced on what depends on them: minimatch before 11.0.1 has a
# denial of service through glob parts (GHSA-g3hv-75wg-m249, Dependabot
# alert #9); ESLint's config arrays ask for 10.
overrides:
  "minimatch@>=7.0.0 <11.0.1": 11.0.1
