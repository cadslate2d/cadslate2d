# pnpm's settings for the web project. A dependency is taken only once it
# has been published for two weeks (in minutes): long enough for a
# malicious or broken release to be found and pulled before it reaches us.
minimumReleaseAge: 20160
# Exceptions, each an exact version, taken knowingly before its two weeks:
# eslint 10.13.0 (published 2026-10-16), merged by the maintainer on
# 2026-10-26 (#308). Remove the line once that date is two weeks past.
minimumReleaseAgeExclude:
  - eslint@10.13.0
